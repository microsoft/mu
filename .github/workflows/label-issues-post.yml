# This workflow applies labels to pull requests after the "Apply Issue and PR Labels" workflow records the
# pull request number, and to issues when they are opened or edited. It runs from the default branch with
# access to secrets, which the pull_request workflow does not have.
#
# NOTE: This file is automatically synchronized from Mu DevOps. Update the original file there
#       instead of the file in this repo.
#
# NOTE: This file uses a reusable workflow. Do not make changes to the file that should be made
#       in the common/reusable workflow.
#
# - Mu DevOps Repo: https://github.com/microsoft/mu_devops
# - File Sync Settings: https://github.com/microsoft/mu_devops/blob/main/.sync/Files.yml
#
